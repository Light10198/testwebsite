<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Directory</title>
<!-- lucian sales wuz here --!>
  <!-- new.css Framework -->
  <link rel="stylesheet" href="https://fonts.xz.style/serve/inter.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@exampledev/new.css@1.1.2/new.min.css">

  <style>
    .section-container {
      margin-bottom: 2rem;
    }
    .button-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }
    .button-grid button {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .status-msg {
      font-style: italic;
      color: #666;
    }
    footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--nc-bg-3, #eaeaea);
      text-align: center;
      color: var(--nc-font-secondary, #666);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>App Directory</h1>
    <p>Select any application below to launch it.</p>
  </header>

  <main id="app-container">
    <p class="status-msg">Scanning repository for categorized HTML pages...</p>
  </main>

  <footer>
    <p>lucian sales made this yay!</p>
  </footer>

  <script>
    (async function scanAndCategorizeRepository() {
      const container = document.getElementById('app-container');
      const owner = 'Light10198';
      const repo = 'testwebsite.github.io';
      const endpoint = `https://api.github.com/repos/${owner}/${repo}/contents/`;

      try {
        const response = await fetch(endpoint, {
          headers: {
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!response.ok) {
          throw new Error(`GitHub API returned status ${response.status}`);
        }

        const items = await response.json();

        // Filter: Keep only .html files, excluding directory and error handlers
        const ignoredFiles = new Set(['index.html', '404.html']);
        const htmlPages = items.filter(item => 
          item.type === 'file' &&
          item.name.toLowerCase().endsWith('.html') &&
          !ignoredFiles.has(item.name.toLowerCase())
        );

        container.innerHTML = '';

        if (htmlPages.length === 0) {
          container.innerHTML = '<p class="status-msg">No sub-pages currently found in the root directory.</p>';
          return;
        }

        // Pattern to match "(section: <name>)" case-insensitively
        const sectionRegex = /\s*\(\s*section:\s*([^)]+)\s*\)/i;

        // Group files by extracted section name
        const sections = {};

        htmlPages.forEach(file => {
          const rawName = file.name.replace(/\.html$/i, '');
          const match = rawName.match(sectionRegex);

          let sectionName = 'General';
          let displayName = rawName;

          if (match) {
            sectionName = match[1].trim();
            // Remove the (section: ...) tag from the button label
            displayName = rawName.replace(match[0], '').trim();
          }

          if (!sections[sectionName]) {
            sections[sectionName] = [];
          }

          sections[sectionName].push({
            displayName: displayName || rawName,
            fileName: file.name
          });
        });

        // Sort section titles alphabetically, putting "General" last if present
        const sortedSectionNames = Object.keys(sections).sort((a, b) => {
          if (a === 'General') return 1;
          if (b === 'General') return -1;
          return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
        });

        // Render each section with an h2 header and a button grid
        sortedSectionNames.forEach(sectionTitle => {
          const sectionEl = document.createElement('section');
          sectionEl.className = 'section-container';

          const heading = document.createElement('h2');
          heading.textContent = sectionTitle;
          sectionEl.appendChild(heading);

          const grid = document.createElement('div');
          grid.className = 'button-grid';

          // Sort items alphabetically inside each section
          sections[sectionTitle].sort((a, b) => 
            a.displayName.localeCompare(b.displayName, undefined, { numeric: true, sensitivity: 'base' })
          );

          sections[sectionTitle].forEach(page => {
            const button = document.createElement('button');
            button.textContent = page.displayName;

            button.addEventListener('click', () => {
              window.location.href = encodeURI(page.fileName);
            });

            grid.appendChild(button);
          });

          sectionEl.appendChild(grid);
          container.appendChild(sectionEl);
        });

      } catch (err) {
        console.error('Error fetching file list:', err);
        container.innerHTML = `
          <p style="color: #c00;">
            Unable to load page list automatically (${err.message}).
            <br>
            <small>Note: Unauthenticated GitHub API calls are limited to 60 requests per hour per IP.</small>
          </p>`;
      }
    })();
  </script>
</body>
</html>
